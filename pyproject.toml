[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha1s-studio"
version = "0.3.0"
requires-python = ">=3.10"
description = "Embodied AI studio for Alpha 1S: embedded protocol integration, actuator control and Gemini conversation"
readme = "README.md"
license = {file = "LICENSE"}

[project.optional-dependencies]
credentials = ["keyring>=23,<26"]
gemini = ["google-genai>=1,<3"]

[tool.setuptools.packages.find]
include = ["alpha_demo*"]
