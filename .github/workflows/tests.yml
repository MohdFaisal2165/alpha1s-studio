name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test-only desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Run tests without a robot
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
