name: alpha1s-studio-sim
services:
  isaac:
    profiles: [manual]
    image: nvcr.io/nvidia/isaac-sim:6.2.0
    user: "1234:1234"
    working_dir: /isaac-sim
    entrypoint: ["/bin/bash"]
    command: ["-l"]
    stdin_open: true
    tty: true
    restart: "no"
    cpus: 6
    mem_limit: 16g
    shm_size: 2g
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      ACCEPT_EULA: ${ALPHA_SIM_ACCEPT_EULA:-N}
      NVIDIA_DRIVER_CAPABILITIES: graphics,utility,compute
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ALPHA_SIM_GPU_ID:-0}"]
              capabilities: [gpu]
    volumes:
      - ./workspace:/workspace:ro
      - main-cache:/isaac-sim/.cache
      - compute-cache:/isaac-sim/.nv/ComputeCache
      - kit-cache:/isaac-sim/kit/cache
      - logs:/isaac-sim/.nvidia-omniverse/logs
      - config:/isaac-sim/.nvidia-omniverse/config
      - data:/isaac-sim/.local/share/ov/data
      - packages:/isaac-sim/.local/share/ov/pkg
volumes:
  main-cache:
  compute-cache:
  kit-cache:
  logs:
  config:
  data:
  packages:
